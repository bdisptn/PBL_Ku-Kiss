<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Pengaturan dasar agar website nyaman dibuka di desktop maupun HP. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KU-KISS, toko cookies dengan beragam pilihan rasa.">
  <title>KU-KISS | Cookies</title>

  <!-- Bootstrap dipakai untuk layout, tombol, modal, dan komponen responsif. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- Bootstrap Icons untuk ikon navigasi dan tombol. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >
  <!-- Font utama website. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <!-- CSS khusus KU-KISS. -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- JavaScript menampilkan halaman pelanggan atau admin di area ini. -->
  <div id="root"></div>

  <!-- Modal bersama untuk form admin dan informasi pembayaran. -->
  <div class="modal fade" id="m" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content box3d">
        <div class="modal-header">
          <h5 class="modal-title text-maroon" id="mt"></h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Tutup"
          ></button>
        </div>
        <div class="modal-body" id="mb"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-maroon" id="mok">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JavaScript dibutuhkan untuk modal dan menu mobile. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js dipakai untuk grafik pada dashboard admin. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Logika navigasi dan fitur website KU-KISS. -->
  <script src="js/app.js"></script>
</body>
</html>
